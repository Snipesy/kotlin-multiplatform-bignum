name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-tests:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: jvmTest
            name: JVM
            os: ubuntu-latest
          - target: jsBrowserTest
            name: JS
            os: ubuntu-latest
          - target: wasmJsBrowserTest
            name: Wasm
            os: ubuntu-latest
          - target: wasmWasiNodeTest
            name: WASI
            os: ubuntu-latest
          - target: linuxX64Test
            name: Linux
            os: ubuntu-latest
          - target: macosArm64Test
            name: macOS
            os: macos-latest
          - target: iosSimulatorArm64Test
            name: iOS Simulator
            os: macos-latest
          - target: mingwX64Test
            name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Fetch origin/main for Spotless ratchet
        run: git fetch origin main

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Set up Chrome
        if: matrix.name == 'JS' || matrix.name == 'Wasm'
        uses: browser-actions/setup-chrome@v1

      - name: Cache Kotlin/Native
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: >-
          ./gradlew ${{ matrix.target }}
          --stacktrace
          --no-daemon
          --no-parallel
          --build-cache
